name: IBassoDongleControl
options:
  bundleIdPrefix: app.donglecontrol
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  BassoCore:
    type: framework
    platform: macOS
    sources: Sources/BassoCore
    dependencies:
      - sdk: IOKit.framework
      - sdk: AudioToolbox.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donglecontrol.core
        GENERATE_INFOPLIST_FILE: YES
  DongleControlFeature:
    type: framework
    platform: macOS
    sources: Sources/DongleControlFeature
    dependencies:
      - target: BassoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donglecontrol.feature
        GENERATE_INFOPLIST_FILE: YES
  ibasso-dongle:
    type: tool
    platform: macOS
    sources: Sources/BassoCLI
    dependencies:
      - target: BassoCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donglecontrol.cli
  Dongle Control for iBasso:
    type: application
    platform: macOS
    sources: Sources/DongleControlApp
    dependencies:
      - target: BassoCore
      - target: DongleControlFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donglecontrol.mac
        PRODUCT_NAME: Dongle Control for iBasso
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dongle Control for iBasso
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        ENABLE_APP_SANDBOX: NO
  BassoCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: Tests/BassoCoreTests
    dependencies:
      - target: BassoCore
      - target: DongleControlFeature
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.donglecontrol.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Dongle Control for iBasso:
    build:
      targets:
        Dongle Control for iBasso: all
        BassoCoreTests: [test]
    test:
      targets:
        - BassoCoreTests
